[project]
name = "markethub"
version = "0.1.0"
description = "Market Hub: sign in with Google, keep your portfolio or watchlist, monitor it and open the analysis tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "google-auth>=2.59.1",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-storage>=2.18",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
